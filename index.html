<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spellforge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314161c'/%3E%3Cpath d='M16 6 L26 26 H6 Z' fill='%23d8b26a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Deck selection -->
  <section id="setup" class="screen">
    <div class="setup-inner">
      <h1 class="logo">Spellforge</h1>
      <p class="tagline">A trading card game with a full rules engine — stack, priority, phases, combat.<br />
        Pick a deck. Claude picks one too, and plays without ever seeing your hand.</p>

      <div class="deck-columns">
        <div>
          <h2>Your deck</h2>
          <div class="deck-list" id="deckListYou"></div>
        </div>
        <div>
          <h2>Claude's deck</h2>
          <div class="deck-list" id="deckListAi"></div>
        </div>
      </div>

      <div class="setup-actions">
        <label class="check"><input type="checkbox" id="optAutoPass" checked /> Skip steps where I have nothing to do</label>
        <label class="check"><input type="checkbox" id="optFastAi" /> Fast opponent</label>
        <button class="btn primary big" id="startBtn">Start game</button>
      </div>
    </div>
  </section>

  <!-- Table -->
  <section id="table" class="screen hidden">
    <header class="topbar">
      <div class="player-tag" id="tagAi"></div>
      <div class="turn-info">
        <span id="turnLabel">Turn 1</span>
        <span class="dot">·</span>
        <span id="stepLabel">Main phase</span>
      </div>
      <div class="topbar-right">
        <button class="btn ghost" id="logBtn">Log</button>
        <button class="btn ghost" id="concedeBtn">Concede</button>
      </div>
    </header>

    <main class="board">
      <div class="side opponent">
        <div class="zone-row lands" id="aiLands"></div>
        <div class="zone-row creatures" id="aiCreatures"></div>
      </div>

      <div class="midline">
        <div class="stack-area" id="stackArea"></div>
        <div class="phase-track" id="phaseTrack"></div>
      </div>

      <div class="side you">
        <div class="zone-row creatures" id="youCreatures"></div>
        <div class="zone-row lands" id="youLands"></div>
      </div>
    </main>

    <div class="prompt-bar">
      <div class="prompt" id="prompt"></div>
      <div class="prompt-actions" id="promptActions"></div>
    </div>

    <footer class="handbar">
      <div class="player-tag" id="tagYou"></div>
      <div class="hand" id="hand"></div>
    </footer>

    <aside class="logpanel hidden" id="logPanel">
      <div class="logpanel-head"><strong>Game log</strong><button class="btn ghost small" id="logClose">Close</button></div>
      <div class="logpanel-body" id="logBody"></div>
    </aside>

    <div class="overlay hidden" id="overlay">
      <div class="overlay-card">
        <h2 id="overlayTitle">Game over</h2>
        <p id="overlayText"></p>
        <div class="overlay-actions">
          <button class="btn primary" id="rematchBtn">Play again</button>
          <button class="btn ghost" id="newDecksBtn">Change decks</button>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
